<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support queue — Geoxis</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/brand/favicon.ico" sizes="any" />
  <meta name="theme-color" content="#060b1a" />
  <link rel="stylesheet" href="/src/theme.css" />
</head>
<body>
  <header data-shell data-active=""></header>
  <main class="page">
    <p class="eyebrow"><span class="live-dot" aria-hidden="true"></span>Owner · admin</p>
    <h1 class="title">Support queue</h1>
    <p class="lead">Owner/admin only. awad@apixis.dev and alaidaroosawad@gmail.com are the owner accounts.</p>
    <p id="status" class="muted" style="margin-top:16px">Checking session…</p>
    <div id="tickets" style="margin-top:14px;display:grid;gap:12px"></div>
  </main>
  <footer data-shell-footer></footer>
  <script type="module">
    import "/src/shell.js";
    import { authHeader, loadMe } from "/src/authClient.js";
    const status = document.getElementById("status");
    const tickets = document.getElementById("tickets");
    const me = await loadMe().catch(() => null);
    if (!me) {
      status.innerHTML = 'Not signed in. <a style="color:var(--primary-2)" href="/login">Sign in</a>.';
    } else if (!me.admin) {
      status.textContent = `Signed in as ${me.user.email}; owner/admin access required.`;
    } else {
      const res = await fetch("/api/admin/support", { headers: authHeader(), cache: "no-store" });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) status.textContent = data.error || "Could not load tickets.";
      else {
        status.textContent = `${data.tickets.length} ticket(s)`;
        tickets.innerHTML = data.tickets.map((t) => `<article class="panel"><div class="panel-head"><div class="panel-title">${escapeHtml(t.subject)}</div><span class="chip" style="margin-left:auto">${escapeHtml(t.status)}</span></div><div class="panel-body"><p class="dim" style="font-size:12px;margin:0 0 8px">${escapeHtml(t.requester_email)} → ${escapeHtml(t.route_to)} · ${new Date(t.created_at).toLocaleString()}</p><p style="white-space:pre-wrap;margin:0;color:var(--text-2)">${escapeHtml(t.message)}</p></div></article>`).join("") || '<p class="dim">No tickets yet.</p>';
      }
    }
    function escapeHtml(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
  </script>
  <script type="module" src="/src/walletPill.js"></script>
</body>
</html>
