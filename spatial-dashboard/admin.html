<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geoxis Admin</title>
  <link rel="stylesheet" href="/src/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 2026-10-17 (Geoxis Lead / Grok): official logo + brand kit (public/brand/). -->
  <link rel="icon" href="/brand/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
  <link rel="manifest" href="/brand/site.webmanifest" />
  <meta name="theme-color" content="#0f1117" />
  <meta property="og:image" content="https://spatial-dashboard-xi.vercel.app/brand/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:image" content="https://spatial-dashboard-xi.vercel.app/brand/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
</head>
<body class="min-h-screen bg-surface-0 text-slate-100 font-sans p-6">
  <main class="mx-auto max-w-5xl">
    <a href="/" class="inline-block mb-3"><img src="/brand/logo-header.png" alt="Geoxis" width="89" height="28" class="h-8 w-auto" /></a>
    <a href="/" class="block text-emerald-300 text-sm">← Geoxis globe</a>
    <div class="mt-5 flex items-end justify-between gap-4">
      <div>
        <h1 class="text-2xl font-semibold">Support queue</h1>
        <p class="mt-1 text-sm text-slate-400">Owner/admin only. awad@apixis.dev and alaidaroosawad@gmail.com are the owner accounts.</p>
      </div>
      <a href="/login" class="rounded-md border border-line px-3 py-2 text-sm">Login</a>
    </div>
    <p id="status" class="mt-5 text-sm text-slate-400">Checking session…</p>
    <div id="tickets" class="mt-5 grid gap-3"></div>
    <!-- Other Ixis companies (2026-09-29, Geoxis Lead / Grok): links rendered from src/ixisCompanies.js -->
    <footer class="mt-6 pt-4 border-t border-line">
      <div class="text-[12px] text-slate-500 mb-1">Other Ixis companies</div>
      <nav data-ixis-companies aria-label="Other Ixis companies" class="flex flex-wrap gap-x-3 gap-y-0 text-[12px]"></nav>
    </footer>
  </main>
  <script type="module">
    import { authHeader, loadMe } from "/src/authClient.js";
    const status = document.getElementById("status");
    const tickets = document.getElementById("tickets");
    const me = await loadMe().catch(() => null);
    if (!me) {
      status.innerHTML = 'Not signed in. <a class="text-emerald-300" href="/login">Send a magic link</a>.';
    } else if (!me.admin) {
      status.textContent = `Signed in as ${me.user.email}; owner/admin access required.`;
    } else {
      const res = await fetch("/api/admin/support", { headers: authHeader(), cache: "no-store" });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) status.textContent = data.error || "Could not load tickets.";
      else {
        status.textContent = `${data.tickets.length} ticket(s)`;
        tickets.innerHTML = data.tickets.map((t) => `<article class="rounded-lg border border-line bg-surface-1 p-4"><div class="flex justify-between gap-4"><h2 class="font-medium">${escapeHtml(t.subject)}</h2><span class="text-xs text-slate-500">${escapeHtml(t.status)}</span></div><p class="mt-1 text-xs text-slate-500">${escapeHtml(t.requester_email)} → ${escapeHtml(t.route_to)} · ${new Date(t.created_at).toLocaleString()}</p><p class="mt-3 whitespace-pre-wrap text-sm text-slate-300">${escapeHtml(t.message)}</p></article>`).join("") || '<p class="text-slate-500">No tickets yet.</p>';
      }
    }
    function escapeHtml(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
  </script>
  <script type="module" src="/src/walletPill.js"></script>
  <script type="module" src="/src/ixisCompanies.js"></script>
</body>
</html>
