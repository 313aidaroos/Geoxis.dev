<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feed — Geoxis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="/src/theme.css" />
  <link rel="stylesheet" href="/feed.css" />
  <!-- 2026-10-17 (Geoxis Lead / Grok): official logo + brand kit (public/brand/). -->
  <link rel="icon" href="/brand/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
  <meta name="theme-color" content="#0f1117" />
  <meta property="og:image" content="https://geoxis.dev/brand/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:image" content="https://geoxis.dev/brand/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
</head>
<body>
  <!-- Same top bar as the globe's sidebar header (index.html): brand, Login / Support / Admin, family links. -->
  <header data-shell data-active="feed"></header>

  <main class="page">
    <p class="eyebrow"><span class="live-dot" aria-hidden="true"></span>Socixis Social · Every Apixis company</p>
    <h1 class="title">One feed from every company</h1>
    <p class="lead">What people across the Apixis family are sharing. Sign in with your Apixis ID to post, follow, comment and tip in Ixis.</p>
    <div id="feed-root" style="margin-top:22px"></div>
  </main>

  <footer data-shell-footer></footer>

  <script>
    window.FEED_SITE = {
      client: "geoxis",
      siteName: "Geoxis",
      sessionUrl: "/api/feed-session",
      sessionHeaders: function () {
        var t = "";
        try { t = localStorage.getItem("geoxis.session.access_token") || ""; } catch (e) {}
        return t ? { Authorization: "Bearer " + t } : {};
      },
      skin: {
        tabs: "gx-feed-tabs",
        tab: "gx-feed-tab",
        tabActive: "gx-feed-tab-on",
        card: "panel gx-feed-card",
        cardHead: "",
        title: "gx-feed-title",
        button: "btn btn-primary btn-sm",
        buttonSecondary: "btn btn-ghost btn-sm",
        buttonSmall: "",
        chip: "chip",
        aiChip: "chip chip-beta",
        input: "field",
        label: "label",
        muted: "muted",
        alert: "gx-feed-alert",
        notice: "gx-feed-notice",
        empty: "empty",
        listRow: "gx-feed-row",
        signInUrl: "/auth/apixis/start?next=%2Ffeed",
        buyIxisUrl: "https://apixis-wallet.vercel.app/buy?product=geoxis"
      }
    };
  </script>
  <script type="module" src="/src/shell.js"></script>
  <script src="/js/feed/feed-app.js" defer></script>
</body>
</html>
