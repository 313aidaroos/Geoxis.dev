<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Password — Geoxis</title>
  <link rel="stylesheet" href="/src/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 2026-10-17 (Geoxis Lead / Grok): official logo + brand kit (public/brand/). -->
  <link rel="icon" href="/brand/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
  <link rel="manifest" href="/brand/site.webmanifest" />
  <meta name="theme-color" content="#0f1117" />
  <meta property="og:image" content="https://spatial-dashboard-xi.vercel.app/brand/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:image" content="https://spatial-dashboard-xi.vercel.app/brand/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
</head>
<body class="min-h-screen bg-surface-0 text-slate-100 flex items-center justify-center p-6">
  <main class="w-full max-w-md rounded-2xl border border-line bg-surface-1 p-6 shadow-2xl">
    <a href="/" class="inline-block mb-3"><img src="/brand/logo-header.png" alt="Geoxis" width="89" height="28" class="h-8 w-auto" /></a>
    <h1 class="text-2xl font-semibold">Choose a password</h1>
    <p class="mt-2 text-sm text-slate-400">Next time you sign in without waiting for an email.</p>
    <form id="passwordForm" class="mt-6 space-y-3">
      <input id="password" type="password" autocomplete="new-password" required placeholder="Choose a password" minlength="8" class="w-full h-11 px-3 rounded-md bg-surface-2 border border-line text-slate-100" />
      <input id="confirm" type="password" autocomplete="new-password" required placeholder="Confirm password" minlength="8" class="w-full h-11 px-3 rounded-md bg-surface-2 border border-line text-slate-100" />
      <button class="w-full h-11 rounded-md bg-emerald-500 text-slate-950 font-medium">Save password</button>
    </form>
    <a href="/" class="mt-4 block text-center text-sm text-slate-400 hover:text-emerald-300">Skip for now →</a>
    <p id="status" class="mt-4 text-sm text-red-300"></p>
  </main>
  <script type="module">
    import { loadMe } from "/src/authClient.js";

    const form = document.getElementById("passwordForm");
    const status = document.getElementById("status");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirm");

    // Check if user is signed in
    const me = await loadMe().catch(() => null);
    if (!me) {
      location.href = "/login.html";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      status.textContent = "";

      const password = passwordInput.value;
      const confirm = confirmInput.value;

      if (password !== confirm) {
        status.textContent = "Passwords do not match.";
        return;
      }

      if (password.length < 8) {
        status.textContent = "Password must be at least 8 characters.";
        return;
      }

      try {
        const cfg = await fetch("/api/config", { cache: "no-store" }).then(r => r.json());
        const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
        const supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

        // has_password stops auth/callback.html from sending this person back here on every magic link.
        const { error } = await supabase.auth.updateUser({ password, data: { has_password: true } });
        if (error) throw error;

        // Redirect to next or home
        const params = new URLSearchParams(location.search);
        const next = params.get("next");
        const safe = next && next.startsWith("/") && !next.startsWith("//") ? next : "/";
        location.href = safe;
      } catch (err) {
        status.textContent = err.message || "Failed to set password.";
      }
    });
  </script>
</body>
</html>
