<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set password — Geoxis</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/brand/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
  <meta name="theme-color" content="#060b1a" />
  <link rel="stylesheet" href="/src/theme.css" />
</head>
<body>
  <header data-shell data-active=""></header>
  <main class="card-page">
    <div class="card panel">
      <div class="panel-body" style="padding:24px">
        <h1 class="title" style="font-size:26px">Choose a password</h1>
        <p class="muted" style="margin:0 0 16px">Next time you sign in without waiting for an email.</p>
        <form id="passwordForm" style="display:grid;gap:8px">
          <input id="password" type="password" autocomplete="new-password" required placeholder="Choose a password" minlength="8" class="field" />
          <input id="confirm" type="password" autocomplete="new-password" required placeholder="Confirm password" minlength="8" class="field" />
          <button class="btn btn-primary">Save password</button>
        </form>
        <a href="/" class="btn btn-ghost" style="width:100%;margin-top:10px">Skip for now →</a>
        <p id="status" class="bad" style="margin:12px 0 0;font-size:13px"></p>
      </div>
    </div>
  </main>
  <footer data-shell-footer></footer>
  <script type="module">
    import "/src/shell.js";
    import { loadMe } from "/src/authClient.js";

    const form = document.getElementById("passwordForm");
    const status = document.getElementById("status");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirm");

    const me = await loadMe().catch(() => null);
    if (!me) location.href = "/login";

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      status.textContent = "";
      const password = passwordInput.value;
      const confirm = confirmInput.value;
      if (password !== confirm) { status.textContent = "Passwords do not match."; return; }
      if (password.length < 8) { status.textContent = "Password must be at least 8 characters."; return; }
      try {
        const cfg = await fetch("/api/config", { cache: "no-store" }).then((r) => r.json());
        const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
        const supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
        // has_password stops auth/callback.html from sending this person back here on every magic link.
        const { error } = await supabase.auth.updateUser({ password, data: { has_password: true } });
        if (error) throw error;
        const params = new URLSearchParams(location.search);
        const next = params.get("next");
        location.href = next && next.startsWith("/") && !next.startsWith("//") ? next : "/";
      } catch (err) {
        status.textContent = err.message || "Failed to set password.";
      }
    });
  </script>
</body>
</html>
