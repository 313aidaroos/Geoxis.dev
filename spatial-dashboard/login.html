<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Geoxis</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/brand/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
  <meta name="theme-color" content="#060b1a" />
  <link rel="stylesheet" href="/src/theme.css" />
</head>
<body>
  <header data-shell data-active=""></header>
  <main class="card-page">
    <div class="card panel">
      <div class="panel-body" style="padding:24px">
        <p class="eyebrow"><span class="live-dot" aria-hidden="true"></span>Geoxis</p>
        <h1 class="title" style="font-size:26px">Sign in to Geoxis</h1>
        <p class="muted" style="margin:0 0 16px">One Apixis ID and one Ixis balance across every Ixis company.</p>

        <a id="apixisSignIn" href="/auth/apixis/start" class="btn btn-primary btn-lg" style="width:100%">Sign in with Apixis</a>
        <p class="dim" style="font-size:12px;margin:10px 0 18px">New to Geoxis? Create your account with Sign in with Apixis. Email link and password are for existing accounts.</p>

        <div class="tabs" role="tablist">
          <button id="tabMagic" class="tab" role="tab" aria-selected="true">Email me a link</button>
          <button id="tabPassword" class="tab" role="tab" aria-selected="false">Password</button>
        </div>

        <form id="magicForm" style="margin-top:14px;display:grid;gap:8px">
          <input id="emailMagic" type="email" autocomplete="email" required placeholder="you@company.com" class="field" />
          <button class="btn btn-soft">Send magic link</button>
        </form>

        <form id="passwordForm" class="hidden" style="margin-top:14px;display:grid;gap:8px">
          <input id="emailPassword" type="email" autocomplete="email" required placeholder="you@company.com" class="field" />
          <input id="password" type="password" autocomplete="current-password" required placeholder="Password" class="field" />
          <button class="btn btn-soft">Sign in</button>
        </form>

        <p id="status" class="muted" style="margin:12px 0 0;font-size:13px"></p>
      </div>
    </div>
  </main>
  <footer data-shell-footer></footer>

  <script type="module">
    import "/src/shell.js";
    import { consumeAuthHash, requestMagicLink } from "/src/authClient.js";

    const tabMagic = document.getElementById("tabMagic");
    const tabPassword = document.getElementById("tabPassword");
    const magicForm = document.getElementById("magicForm");
    const passwordForm = document.getElementById("passwordForm");
    const status = document.getElementById("status");

    const params = new URLSearchParams(location.search);
    const next = params.get("next");
    const safeNext = next && next.startsWith("/") && !next.startsWith("//") ? next : "/";

    function showTab(which) {
      const magic = which === "magic";
      tabMagic.setAttribute("aria-selected", String(magic));
      tabPassword.setAttribute("aria-selected", String(!magic));
      magicForm.classList.toggle("hidden", !magic);
      magicForm.style.display = magic ? "grid" : "none";
      passwordForm.classList.toggle("hidden", magic);
      passwordForm.style.display = magic ? "none" : "grid";
      status.textContent = "";
    }
    tabMagic.onclick = () => showTab("magic");
    tabPassword.onclick = () => showTab("password");
    showTab("magic");

    magicForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      status.textContent = "Sending magic link…";
      try {
        await requestMagicLink(document.getElementById("emailMagic").value, safeNext);
        status.textContent = "Check your email for the Geoxis magic link.";
      } catch (err) {
        status.textContent = err.message || "Login failed.";
      }
    });

    passwordForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      status.textContent = "Signing in…";
      const email = document.getElementById("emailPassword").value;
      const password = document.getElementById("password").value;
      try {
        const cfg = await fetch("/api/config", { cache: "no-store" }).then((r) => r.json());
        const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
        const supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        localStorage.setItem("geoxis.session.access_token", data.session.access_token);
        location.href = safeNext;
      } catch (err) {
        status.textContent = err.message || "Invalid email or password.";
      }
    });

    document.getElementById("apixisSignIn").href = "/auth/apixis/start?next=" + encodeURIComponent(safeNext);
    const apixisError = params.get("error");
    if (apixisError) status.textContent = "Apixis sign-in did not finish (" + apixisError + "). Try again.";
    if (consumeAuthHash()) location.replace(safeNext);
  </script>
</body>
</html>
