<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support — Geoxis</title>
  <meta name="description" content="Geoxis support. Messages go to the Geoxis queue and the owner." />
  <link rel="icon" href="/brand/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
  <meta name="theme-color" content="#060b1a" />
  <link rel="stylesheet" href="/src/theme.css" />
</head>
<body>
  <header data-shell data-active=""></header>
  <main class="card-page">
    <div class="card card-wide panel">
      <div class="panel-body" style="padding:24px">
        <p class="eyebrow"><span class="live-dot" aria-hidden="true"></span>Support</p>
        <h1 class="title" style="font-size:26px">Geoxis support</h1>
        <p class="muted" style="margin:0 0 16px">Messages enter the geoxis@apixis.dev queue and route to awad@apixis.dev.</p>
        <form id="supportForm" style="display:grid;gap:8px">
          <input id="email" type="email" required placeholder="you@company.com" class="field" />
          <input id="subject" required minlength="3" maxlength="140" placeholder="Subject" class="field" />
          <textarea id="message" required minlength="10" maxlength="5000" rows="7" placeholder="What do you need help with?" class="field"></textarea>
          <button class="btn btn-primary">Send to support</button>
        </form>
        <p id="status" class="muted" style="margin:12px 0 0;font-size:13px"></p>
      </div>
    </div>
  </main>
  <footer data-shell-footer></footer>
  <script type="module">
    import "/src/shell.js";
    import { authHeader, loadMe } from "/src/authClient.js";
    const status = document.getElementById("status");
    loadMe().then((me) => { if (me?.user?.email) document.getElementById("email").value = me.user.email; }).catch(() => {});
    document.getElementById("supportForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      status.textContent = "Sending…";
      const payload = {
        email: document.getElementById("email").value,
        subject: document.getElementById("subject").value,
        message: document.getElementById("message").value,
      };
      const res = await fetch("/api/support", { method: "POST", headers: { "Content-Type": "application/json", ...authHeader() }, body: JSON.stringify(payload) });
      const data = await res.json().catch(() => ({}));
      status.textContent = res.ok ? `Ticket ${data.ticket.id} created and routed to ${data.ticket.route_to}.` : (data.error || "Support failed.");
      if (res.ok) e.target.reset();
    });
  </script>
  <script type="module" src="/src/walletPill.js"></script>
</body>
</html>
