<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signing in… — Geoxis</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/brand/favicon.ico" sizes="any" />
  <meta name="theme-color" content="#060b1a" />
  <link rel="stylesheet" href="/src/theme.css" />
</head>
<body>
  <main class="card-page">
    <div style="text-align:center">
      <img src="/brand/logo-full.png" alt="Geoxis" width="120" height="36" style="height:36px;width:auto;margin:0 auto 14px;display:block" />
      <div class="muted">Signing you in…</div>
    </div>
  </main>
  <script type="module">
    import { consumeAuthHash } from "/src/authClient.js";

    consumeAuthHash();
    const params = new URLSearchParams(location.search);
    const code = params.get("code");
    const next = params.get("next");
    const safe = next && next.startsWith("/") && !next.startsWith("//") ? next : "/";

    async function supabase() {
      const cfg = await fetch("/api/config", { cache: "no-store" }).then((r) => r.json());
      const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
      return createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    }
    const go = (hasPassword) => { location.href = hasPassword ? safe : `/set-password?next=${encodeURIComponent(safe)}`; };

    if (code) {
      try {
        const sb = await supabase();
        const { data, error } = await sb.auth.exchangeCodeForSession(code);
        if (error) throw error;
        go(data.user?.user_metadata?.has_password);
      } catch (err) {
        console.error("[callback] PKCE exchange failed:", err);
        location.href = "/login";
      }
    } else {
      setTimeout(async () => {
        const token = localStorage.getItem("geoxis.session.access_token");
        if (!token) { location.href = "/login"; return; }
        const sb = await supabase();
        const { data } = await sb.auth.getUser();
        go(data.user?.user_metadata?.has_password);
      }, 500);
    }
  </script>
</body>
</html>
